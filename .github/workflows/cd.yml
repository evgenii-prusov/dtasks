name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'

# Two merges landing close together would otherwise deploy concurrently and
# could reach the server out of order. Queueing them (rather than
# cancel-in-progress) keeps the newest commit last without ever interrupting a
# run mid-deploy: the SSH step's remote `docker compose up` is not something
# GitHub can cancel cleanly, and a half-applied update is worse than a wait.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Native ARM64, matching the A1 Flex target: the same image built through
    # QEMU emulation on an x86 runner took upwards of five minutes. Free for
    # public repositories.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # No QEMU: the runner is already the target architecture.
      - uses: docker/setup-buildx-action@v3

      - name: Set image name and short SHA
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/dtasks
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
